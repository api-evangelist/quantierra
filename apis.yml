name: Quantierra
description: >-
  Quantierra (Quantierra Advisors LLC) is a quantitative real estate advisory
  firm that uses proprietary software to source, analyze, and execute real
  estate transactions on behalf of institutional investors, family offices,
  nonprofits, and everyone in between. The firm blends data-driven deal sourcing
  and quantitative underwriting with traditional brokerage and advisory
  services. Quantierra keeps a deliberately low public profile at the preference
  of its clients and does not publish a public developer program, API, or
  self-service platform; its technology is used internally to support client
  engagements rather than exposed as a product.
